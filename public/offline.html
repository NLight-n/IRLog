<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - IRLog</title>
  <style>
    :root {
      --bg: #18181b;
      --card-bg: #27272a;
      --text: #f4f4f5;
      --subtext: #a1a1aa;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #3f3f46;
      --btn-secondary: #3f3f46;
      --btn-secondary-hover: #52525b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f4f5;
        --card-bg: #ffffff;
        --text: #18181b;
        --subtext: #71717a;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --border: #e4e4e7;
        --btn-secondary: #e4e4e7;
        --btn-secondary-hover: #d4d4d8;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.25rem 1.75rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25);
    }
    .icon-container {
      width: 68px;
      height: 68px;
      background-color: rgba(245, 158, 11, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem auto;
    }
    .icon-container svg {
      width: 34px;
      height: 34px;
      stroke: #f59e0b;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
      color: var(--text);
    }
    p {
      color: var(--subtext);
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .btn {
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-primary {
      background-color: var(--accent);
    }
    .btn-primary:hover {
      background-color: var(--accent-hover);
    }
    .btn-secondary {
      background-color: var(--btn-secondary);
      color: var(--text);
    }
    .btn-secondary:hover {
      background-color: var(--btn-secondary-hover);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.5 6.2A9 9 0 0121 12m-4.5 4.5A4.5 4.5 0 0112 16.5m-3-1.5a4.5 4.5 0 01-.7-5.5M6 9.3A9 9 0 003 12" />
      </svg>
    </div>
    <h1>Offline / Server Unreachable</h1>
    <p>IRLog cannot reach the host server right now. You can still access and view your locally cached appointments and procedure records below.</p>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="window.location.reload()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
        </svg>
        Retry Connection
      </button>
      <a class="btn btn-secondary" href="/worklist">
        📅 View Cached Worklist (Appointments)
      </a>
      <a class="btn btn-secondary" href="/">
        📋 View Cached Procedure Registry
      </a>
    </div>
  </div>
</body>
</html>
